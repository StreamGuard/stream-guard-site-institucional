<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- bootstrap css link -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="./css/style.css">

  <title>Stream Guard | Página Inicial</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg fixed-top px-3" style="background-color: #102031;">
    <div class="container-fluid">
      <!-- logo -->
      <a class="navbar-brand text-white poppins-medium" href="#">
        <img src="./assets/streamGuard_logo.png" alt="Stream Guard" width="60" height="50" class="d-inline-block align-text-top">
      </a>

      <!-- botao só aparece em telas pequenas (celulares) / bootstrap -->
      <button class="navbar-toggler menu-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Abrir menu">
        <span class="menu-icon"></span>
        <span class="menu-icon"></span>
        <span class="menu-icon"></span>
      </button>

      <!-- menu nav -->
      <div class="offcanvas offcanvas-end custom-offcanvas" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">

        <!-- cabeçalho aparece somente no celular -->
        <div class="offcanvas-header custom-offcanvas-header">
          <div class="d-flex align-items-center gap-2">
            <img
              src="./assets/streamGuard_logo.png"
              alt="Stream Guard"
              width="32"
              height="32"
            >

            <h5 class="offcanvas-title mb-0 text-white poppins-medium" id="offcanvasNavbarLabel">
              Stream Guard
            </h5>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>

        <!-- corpo aparece sempre -->
        <div class="offcanvas-body d-lg-flex align-items-lg-center w-100">
          <!-- links da navbar -->
          <ul class="navbar-nav custom-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Página principal</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Sobre</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Equipe</a>
            </li>
          </ul>

          <!-- botoes -->
          <div class="d-flex flex-column flex-lg-row gap-2 ms-lg-auto auth-buttons">
            <a href="#" class="btn btn-outline-primary">Login</a>
            <a href="#" class="btn btn-primary">Cadastro</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- bootstrap js link -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
