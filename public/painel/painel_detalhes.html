<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Componentes do equipamento | Stream Guard</title>

    <link rel="stylesheet" href="./css/painel_base.css">
    <link rel="stylesheet" href="./css/painel_modais.css">
    <link rel="stylesheet" href="./css/painel_detalhes.css">
    <link rel="icon" type="image/png" href="../assets/streamGuard_logo.png">
</head>

<body data-pagina="detalhes" data-edicao>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <polyline points="9 12 11 14 15 10" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
        </symbol>
        <symbol id="i-server" viewBox="0 0 24 24">
            <rect x="2" y="2" width="20" height="8" rx="2" />
            <rect x="2" y="14" width="20" height="8" rx="2" />
            <line x1="6" y1="6" x2="6.01" y2="6" />
            <line x1="6" y1="18" x2="6.01" y2="18" />
        </symbol>
        <symbol id="i-bell" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
        </symbol>
        <symbol id="i-building" viewBox="0 0 24 24">
            <rect x="4" y="2" width="16" height="20" rx="2" />
            <path d="M9 22v-4h6v4" />
            <line x1="8" y1="6" x2="8.01" y2="6" />
            <line x1="12" y1="6" x2="12.01" y2="6" />
            <line x1="16" y1="6" x2="16.01" y2="6" />
            <line x1="8" y1="10" x2="8.01" y2="10" />
            <line x1="12" y1="10" x2="12.01" y2="10" />
            <line x1="16" y1="10" x2="16.01" y2="10" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
            <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
        </symbol>
        <symbol id="i-cpu" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <rect x="9" y="9" width="6" height="6" />
            <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
        </symbol>
        <symbol id="i-ram" viewBox="0 0 24 24">
            <rect x="2" y="7" width="20" height="9" rx="1" />
            <path d="M6 10v3M10 10v3M14 10v3M18 10v3M6 16v2M10 16v2M14 16v2M18 16v2" />
        </symbol>
        <symbol id="i-disk" viewBox="0 0 24 24">
            <line x1="22" y1="12" x2="2" y2="12" />
            <path
                d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
            <line x1="6" y1="16" x2="6.01" y2="16" />
            <line x1="10" y1="16" x2="10.01" y2="16" />
        </symbol>
        <symbol id="i-network" viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
        </symbol>
        <symbol id="i-zap" viewBox="0 0 24 24">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </symbol>
    </svg>

    <div class="layout">

        <aside class="sidebar" data-shell="sidebar"></aside>

        <div class="conteudo">
            <header class="topo">
                <div>
                    <h1>Componentes do equipamento</h1>
                    <p>srv-stream-01 • StreamCo Brasil</p>
                </div>
                <div class="topo-direita" data-shell="topo-direita"></div>
            </header>

            <main class="principal">

                <section class="kpis" aria-label="Resumo dos componentes">
                    <article class="kpi"><span>Componentes</span><strong id="kpiTotal">0</strong><small>cadastrados neste equipamento</small></article>
                    <article class="kpi kpi-verde"><span>Normais</span><strong id="kpiOk">0</strong><small>dentro dos limites</small></article>
                    <article class="kpi kpi-laranja"><span>Em alerta</span><strong id="kpiAlerta">0</strong><small>perto do limite</small></article>
                    <article class="kpi kpi-vermelho"><span>Críticos</span><strong id="kpiCritico">0</strong><small>precisam de ação agora</small></article>
                </section>

                <div class="seletores">
                    <div class="seletores-grupo">
                        <label class="campo"><span>EMPRESA</span>
                            <select class="select">
                                <option>StreamCo Brasil</option>
                            </select>
                        </label>
                        <label class="campo"><span>EQUIPAMENTO</span>
                            <select class="select">
                                <option>srv-stream-01</option>
                            </select>
                        </label>
                    </div>
                    <span class="tag verde selo-contagem" id="seloContagem"><i class="bolinha verde"></i> 5 componentes ativos</span>
                </div>

                <section class="painel tabela-painel">
                    <div class="filtros">
                        <div class="filtros-esquerda">
                            <label class="busca"><svg class="ic" aria-hidden="true">
                                    <use href="#i-search" />
                                </svg><input type="search" id="busca" placeholder="Buscar componente"></label>
                            <label class="campo"><span>TIPO</span>
                                <select class="select" id="filtroTipo">
                                    <option value="">Todos os tipos</option>
                                    <option>Processador</option>
                                    <option>Memória</option>
                                    <option>Armazenamento</option>
                                    <option>Rede</option>
                                    <option>Hardware</option>
                                </select>
                            </label>
                            <label class="campo"><span>STATUS</span>
                                <select class="select" id="filtroStatus">
                                    <option value="">Todos os status</option>
                                    <option>OK</option>
                                    <option>ALERTA</option>
                                    <option>CRÍTICO</option>
                                </select>
                            </label>
                        </div>
                        <button class="btn-adicionar" data-perm="criar"><svg class="ic" aria-hidden="true">
                                <use href="#i-plus" />
                            </svg> Novo componente</button>
                    </div>

                    <div class="tabela-rolagem">
                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>COMPONENTE</th>
                                    <th>TIPO</th>
                                    <th>USO ATUAL</th>
                                    <th>STATUS</th>
                                    <th>ÚLTIMA ATUALIZAÇÃO</th>
                                    <th>AÇÕES</th>
                                </tr>
                            </thead>
                            <tbody id="corpoTabela"></tbody>
                        </table>
                    </div>

                    <footer class="rodape-tabela">
                        <small id="contagem">Exibindo 1–5 de 5 componentes</small>
                        <nav class="paginacao" aria-label="Paginação">
                            <button class="pag" disabled aria-label="Página anterior">‹</button>
                            <button class="pag ativo" aria-current="page">1</button>
                            <button class="pag" disabled aria-label="Próxima página">›</button>
                        </nav>
                    </footer>
                </section>

            </main>
        </div>
    </div>

    <script src="./js/painel_shell.js"></script>
    <script src="./js/painel_modais.js"></script>
    <script src="./js/painel_detalhes.js"></script>
</body>

</html>
