<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1424 800" width="1424" height="800" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14c8a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14c8a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1fa3d1" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#1fa3d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ee0b8"/>
      <stop offset="1" stop-color="#1fa3d1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fa3d1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1ee0b8"/>
      <stop offset="1" stop-color="#1fa3d1" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1424" height="800" fill="url(#bg)"/>
  <circle cx="1200" cy="140" r="380" fill="url(#glowTeal)"/>
  <circle cx="220" cy="700" r="420" fill="url(#glowCyan)"/>
  <circle cx="712" cy="360" r="360" fill="url(#glowTeal)" opacity="0.55"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 100H1424M0 200H1424M0 300H1424M0 400H1424M0 500H1424M0 600H1424M0 700H1424"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800M1200 0V800M1300 0V800"/>
  </g>

  <!-- Concentric rings -->
  <g fill="none" stroke="#1ee0b8">
    <circle cx="712" cy="360" r="110" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="712" cy="360" r="170" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="712" cy="360" r="235" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle cx="712" cy="360" r="305" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>

  <!-- Signal dots on rings -->
  <circle cx="822" cy="360" r="6" fill="#1ee0b8"/>
  <circle cx="612" cy="196" r="5" fill="#1fa3d1"/>
  <circle cx="860" cy="520" r="5" fill="#1ee0b8"/>
  <circle cx="482" cy="400" r="4" fill="#1fa3d1"/>

  <!-- LIVE badge -->
  <g transform="translate(712 214)">
    <rect x="-46" y="-17" width="92" height="34" rx="8" fill="#ef3b5d"/>
    <circle cx="-24" cy="0" r="6" fill="#fff"/>
    <text x="-10" y="6" font-size="17" font-weight="700" fill="#fff" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- Play button -->
  <circle cx="712" cy="360" r="74" fill="#1ee0b8" opacity="0.25" filter="url(#blur)"/>
  <circle cx="712" cy="360" r="62" fill="#0b1220" stroke="url(#playBtn)" stroke-width="5"/>
  <path d="M696 328 L696 392 L748 360 Z" fill="url(#playBtn)"/>

  <!-- Viewers -->
  <g transform="translate(712 470)" text-anchor="middle">
    <circle cx="-72" cy="-5" r="6" fill="#1ee0b8"/>
    <text x="8" y="0" font-size="18" fill="#cfe9e6" font-weight="500">24.381 assistindo</text>
  </g>

  <!-- Chat bubbles left -->
  <g font-size="15" font-weight="500" fill="#e6f4f2">
    <g transform="translate(110 220)">
      <rect width="170" height="44" rx="22" fill="#14c8a8" fill-opacity="0.14" stroke="#14c8a8" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="9" fill="#1ee0b8"/>
      <text x="44" y="27">Bora, ao vivo!</text>
    </g>
    <g transform="translate(170 330)">
      <rect width="120" height="44" rx="22" fill="#1fa3d1" fill-opacity="0.14" stroke="#1fa3d1" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="9" fill="#1fa3d1"/>
      <text x="44" y="27">Show!</text>
    </g>
    <g transform="translate(90 440)">
      <rect width="150" height="44" rx="22" fill="#14c8a8" fill-opacity="0.14" stroke="#14c8a8" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="9" fill="#7be8d2"/>
      <text x="44" y="27">Sem lag!</text>
    </g>
  </g>

  <!-- Chat bubbles right -->
  <g font-size="15" font-weight="500" fill="#e6f4f2">
    <g transform="translate(1130 200)">
      <rect width="190" height="44" rx="22" fill="#1fa3d1" fill-opacity="0.14" stroke="#1fa3d1" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="9" fill="#ef3b5d"/>
      <text x="44" y="27">Olá, chat!</text>
    </g>
    <g transform="translate(1160 320)">
      <rect width="150" height="44" rx="22" fill="#14c8a8" fill-opacity="0.14" stroke="#14c8a8" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="9" fill="#1ee0b8"/>
      <text x="44" y="27">Seguindo</text>
    </g>
    <g transform="translate(1100 440)">
      <rect width="170" height="44" rx="22" fill="#1fa3d1" fill-opacity="0.14" stroke="#1fa3d1" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="9" fill="#7be8d2"/>
      <text x="44" y="27">Novo inscrito</text>
    </g>
  </g>

  <!-- Pulse / heartbeat line (monitoramento) -->
  <path d="M0 585 H430 L470 585 L492 540 L522 625 L548 570 L566 585 H858 L880 585 L902 540 L932 625 L958 570 L976 585 H1424"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="712" y="665" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2">FIQUE NO AR. SEMPRE CONECTADO.</text>
  <text x="712" y="705" text-anchor="middle" font-size="16" font-weight="600" fill="#1ee0b8" letter-spacing="5">TWITCH  •  YOUTUBE  •  KICK  •  TIKTOK LIVE</text>

  <!-- Signal bars corners -->
  <g fill="#1ee0b8" fill-opacity="0.45">
    <rect x="50" y="715" width="10" height="26" rx="3"/>
    <rect x="70" y="702" width="10" height="39" rx="3"/>
    <rect x="90" y="688" width="10" height="53" rx="3"/>
  </g>
  <g fill="#1fa3d1" fill-opacity="0.45">
    <rect x="1324" y="688" width="10" height="53" rx="3"/>
    <rect x="1344" y="702" width="10" height="39" rx="3"/>
    <rect x="1364" y="715" width="10" height="26" rx="3"/>
  </g>
</svg>
