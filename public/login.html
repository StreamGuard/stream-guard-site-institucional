<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Guard | Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/cadastro.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg fixed-top px-3"
      style="background-color: #102031"
    >
      <div class="container-fluid">
        <!-- logo -->
        <a class="navbar-brand text-white poppins-medium" href="#">
          <img
            src="./assets/streamGuard_logo.png"
            alt="Stream Guard"
            width="60"
            height="50"
            class="d-inline-block align-text-top"
          />
        </a>

        <!-- botao só aparece em telas pequenas (celulares) / bootstrap -->
        <button
          class="navbar-toggler menu-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar"
          aria-label="Abrir menu"
        >
          <span class="menu-icon"></span>
          <span class="menu-icon"></span>
          <span class="menu-icon"></span>
        </button>

        <!-- menu nav -->
        <div
          class="offcanvas offcanvas-end custom-offcanvas"
          tabindex="-1"
          id="offcanvasNavbar"
          aria-labelledby="offcanvasNavbarLabel"
        >
          <!-- cabeçalho aparece somente no celular -->
          <div class="offcanvas-header custom-offcanvas-header">
            <div class="d-flex align-items-center gap-2">
              <img
                src="./assets/streamGuard_logo.png"
                alt="Stream Guard"
                width="32"
                height="32"
              />

              <h5
                class="offcanvas-title mb-0 text-white poppins-medium"
                id="offcanvasNavbarLabel"
              >
                Stream Guard
              </h5>
            </div>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Fechar"
            ></button>
          </div>

          <!-- corpo aparece sempre -->
          <div class="offcanvas-body d-lg-flex align-items-lg-center w-100">
            <!-- links da navbar -->
            <ul class="navbar-nav custom-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >Página principal</a
                >
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./about.html">Sobre</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Equipe</a>
              </li>
            </ul>

            <!-- botoes -->
            <div
              class="d-flex flex-column flex-lg-row gap-2 ms-lg-auto auth-buttons"
            >
              <a href="#" class="btn login-button"> Login </a>

              <a href="cadastroUsuario.html" class="btn register-button">
                Cadastro
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <header
      class="container-fluid hero-section position-relative overflow-hidden"
    >
      <div class="hero-bg-text">
        <span>STREAM</span>
        <span>GUARD</span>
      </div>

      <div class="container-fluid hero-content px-4">
        <div class="row justify-content-center">
          <div class="col-12 col-xl-10 text-center">
            <div class="conteudo-cadastro">
              <div class="container-cadastro">
                <h4>Faça seu login</h4>
                <div class="cadastro-empresa">
                  <p>
                    Email:
                    <input
                      type="text"
                      id="email_usuario"
                      placeholder="email@email.com"
                    />
                  </p>
                  <p>
                    Senha:
                    <span class="senha-wrapper">
                      <input
                        type="password"
                        id="senha_usuario"
                        placeholder="Insira sua senha"
                      />
                      <img
                        src="./assets/eyeClose.png"
                        alt="Mostrar senha"
                        class="toggle-senha"
                        id="toggleSenha"
                      />
                    </span>
                  </p>
                </div>
                <a href="#" class="btn register-button botao-cadastro">
                  Entrar
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- bootstrap js link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const toggleSenha = document.getElementById("toggleSenha");
      const senhaInput = document.getElementById("senha_usuario");

      toggleSenha.addEventListener("click", () => {
        const isPassword = senhaInput.type === "password";
        senhaInput.type = isPassword ? "text" : "password";
        toggleSenha.src = isPassword
          ? "./assets/eyeOpen.png"
          : "./assets/eyeClose.png";
      });
    </script>
  </body>
</html>
