<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Usuário</title>
    <link rel="stylesheet" href="/public/css/cadastro.css">
    
</head>
<body>
<header class="header">

    <a href="index.html" class="logo">
        <img src="assets/streamGuard_logo.png" alt="Stream Guard">
    </a>

    <nav class="nav">
        <a href="index.html">Página principal</a>
        <a href="sobre.html">Sobre</a>
        <a href="equipe.html">Equipe</a>
    </nav>

    <div class="header-buttons">
        <a href="login.html" class="btn-login">Login</a>
        <a href="cadastro.html" class="btn-cadastro">Cadastro</a>
    </div>

    <!-- Botão que aparece SOMENTE no mobile -->
    <button class="menu-mobile" id="menuMobile">
        ☰
    </button>

</header>
<script>

    const menuMobile = document.getElementById("menuMobile");
    const mobileMenu = document.getElementById("nav");

    menuMobile.addEventListener("click", () => {

        mobileMenu.classList.toggle("ativo");

    });

</script>
</body>
</html>
